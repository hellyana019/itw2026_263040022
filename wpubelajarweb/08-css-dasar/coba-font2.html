<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba CSS - Font Styling</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Imperial+Script&family=Lora:ital,wght@0,400..700;1,400..700&display=swap");

      @font-face {
        font-family: Lobster;
        src: url("fonts/LobsterTwo-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      h1 {
        color: crimson;
        font-size: 60px;
        text-align: center;
        font-family: "Imperial Script", sans-serif;
      }

      p {
        color: navy;
        text-align: center;
        font-size: 30px;
        font-family: lora, Arial, Helvetica, sans-serif;
      }

      .font-lobster {
        font-family: Lobster, arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Maiores soluta
      nobis rem saepe hic dolore dolorem obcaecati sit nulla mollitia.
    </p>
    <p class="font-lobster">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt corporis
      totam dolores ipsum sapiente.
    </p>
  </body>
</html>
