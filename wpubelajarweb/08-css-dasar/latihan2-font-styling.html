<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Penyemangat</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(75, 72, 72);
        text-align: center;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: rgb(95, 94, 94);
        text-shadow: 5px 5px 0 rgb(214, 213, 213);
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(143, 143, 143);
        font-weight: normal;
      }
    </style>
  </head>

  <body>
    <h1>The Unwritten Tomorrow</h1>

    <p class="quote">
      "Kemarin sudah berlalu,<br />
      hari esok belum datang, <br />
      dan hari ini masih menjadi misteri. <br />
      Jadi, mari jalani hari ini dengan baik."
    </p>

    <p class="credit">— Our Unwritten Seoul feat. Yoo Mi-ji</p>
  </body>
</html>
