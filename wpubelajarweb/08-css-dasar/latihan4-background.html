<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Penyemangat</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(223, 211, 131);
        text-align: center;
        background-color: rgb(63, 0, 0);
        background-image:
          linear-gradient(
            to bottom,
            rgb(15 23 42 / 90%) 50%,
            rgb(15 23 42 / 40%)
          ),
          url("https://picsum.photos/id/10/1000/1000");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-size: 4em;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        /* text-shadow: 5px 5px 0 rgba(214, 208, 143, 0.533); */
        background-image: linear-gradient(
          to right,
          rgb(43, 43, 151),
          rgb(207, 23, 201)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgb(13, 92, 75));
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        background-color: rgb(255 255 255 / 5%);
        max-width: 600px;
        margin: auto;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255 / 10%);
        box-shadow: 0 10px rgb(0 0 0 / 50%);
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(236, 230, 170, 0.363);
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255 / 20%);
        width: 30%;
        margin: 30px auto;
        padding-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>The Unwritten Tomorrow</h1>

    <p class="quote">
      "Kemarin sudah berlalu,<br />
      hari esok belum datang, <br />
      dan hari ini masih menjadi misteri. <br />
      Jadi, mari jalani hari ini dengan baik."
    </p>

    <p class="credit">— Our Unwritten Seoul feat. Yoo Mi-ji</p>
  </body>
</html>
