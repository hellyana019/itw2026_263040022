<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Penyemangat</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(223, 211, 131);
        text-align: center;
        background-color: rgb(63, 0, 0);
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: rgb(237, 225, 129);
        text-shadow: 5px 5px 0 rgba(214, 208, 143, 0.533);
        color: rgb(212, 195, 80);
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(236, 230, 170, 0.363);
        font-weight: normal;
      }
    </style>
  </head>

  <body>
    <h1>The Unwritten Tomorrow</h1>

    <p class="quote">
      "Kemarin sudah berlalu,<br />
      hari esok belum datang, <br />
      dan hari ini masih menjadi misteri. <br />
      Jadi, mari jalani hari ini dengan baik."
    </p>

    <p class="credit">— Our Unwritten Seoul feat. Yoo Mi-ji</p>
  </body>
</html>
